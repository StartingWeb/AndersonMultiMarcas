name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Project/AndersonMultiMarcas.slnx --locked-mode
      - name: Build Release
        run: dotnet build Project/AndersonMultiMarcas.slnx --configuration Release --no-restore
      - name: Start disposable SQL Server for migration integration tests
        run: |
          ci_sql_password="A1!$(openssl rand -hex 24)"
          echo "::add-mask::$ci_sql_password"
          printf 'ANDERSON_TEST_SQL=Server=127.0.0.1,1433;User Id=sa;Password=%s;Encrypt=False;TrustServerCertificate=True\n' "$ci_sql_password" >> "$GITHUB_ENV"
          docker run --detach --name amm-ci-sql --label anderson.purpose=disposable-ci --publish 127.0.0.1:1433:1433 --env ACCEPT_EULA=Y --env "MSSQL_SA_PASSWORD=$ci_sql_password" mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          for _ in $(seq 1 45); do
            if docker exec --env "SQLCMDPASSWORD=$ci_sql_password" amm-ci-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Disposable SQL Server failed readiness; migration tests must not be skipped.' >&2
          exit 1
      - name: Automated .NET tests
        run: dotnet test Project.Tests/Project.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/test-results
      - name: Deployment and security tests (offline)
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/deploy/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/ops/tests -p 'test_*.py' -v
          bash -n scripts/deploy/release.sh scripts/deploy/rollback.sh
          shellcheck scripts/deploy/release.sh scripts/deploy/rollback.sh
      - name: Validate workflow YAML and embedded scripts
        run: python3 scripts/ci/validate_workflows.py
      - name: Exercise isolated Docker deployment and rollback failures
        run: >-
          python3 scripts/deploy/tests/smoke_docker.py
          --base-image nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
          --report artifacts/test-results/deploy-smoke.json
      - name: Generate reviewable SQL without database access
        run: |
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations script --idempotent --project Data/Data.csproj --startup-project Project/Project.csproj --configuration Release --no-build --output artifacts/migrations/review-required.sql
      - name: Validate dedicated runtime installer on disposable SQL
        run: python3 scripts/ops/tests/smoke_runtime_provision.py --container amm-ci-sql --schema-sql artifacts/migrations/review-required.sql
      - name: Audit all NuGet dependencies
        run: |
          mkdir -p artifacts/security
          dotnet list Project/AndersonMultiMarcas.slnx package --vulnerable --include-transitive --format json > artifacts/security/nuget.json
          python3 scripts/ci/check_vulnerabilities.py artifacts/security/nuget.json
      - name: Prepare application artifact from this exact commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          dotnet publish Project/Project.csproj --configuration Release --no-build --no-restore --output artifacts/application/publish
          python3 scripts/ci/application_manifest.py create --application artifacts/application --commit "$SOURCE_COMMIT" --run-id "$CI_RUN_ID"
      - name: Build and verify linux/amd64 runtime image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file deploy/Dockerfile --build-arg COMMIT_SHA="$SOURCE_COMMIT" --tag "andersonmultimarcas-ci:$SOURCE_COMMIT" artifacts/application
          test "$(docker image inspect --format '{{.Architecture}}' "andersonmultimarcas-ci:$SOURCE_COMMIT")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "andersonmultimarcas-ci:$SOURCE_COMMIT")" = app
          python3 scripts/ci/test_runtime_image.py --image "andersonmultimarcas-ci:$SOURCE_COMMIT" --commit "$SOURCE_COMMIT" --report artifacts/test-results/runtime-image.json
      - name: Store immutable application artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/application/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Publish test, SQL and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/
            artifacts/security/
            artifacts/migrations/
          if-no-files-found: warn
          retention-days: 30
      - name: Failure report
        if: failure()
        run: echo 'CI failed. Inspect job logs and ci-evidence artifacts; no production deployment is permitted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove disposable SQL Server
        if: always()
        run: |
          if docker container inspect amm-ci-sql > /dev/null 2>&1; then
            docker rm --force --volumes amm-ci-sql
          fi
